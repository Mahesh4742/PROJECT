name: Sync to Hugging Face Hub

on:
  push:
    branches: [main]
  workflow_dispatch:


jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://mahesh4742:$HF_TOKEN@huggingface.co/spaces/mahesh4742/gptc
          git push --force hf main
